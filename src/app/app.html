<!-- Sistema de Notificaciones -->
<div class="notificaciones-container" *ngIf="notificacion">
  <div class="notificacion" [ngClass]="obtenerClaseNotificacion()">
    <div class="notificacion-contenido">
      <span class="notificacion-icono">
        <ng-container [ngSwitch]="notificacion.tipo">
          <span *ngSwitchCase="'exito'">✓</span>
          <span *ngSwitchCase="'error'">✕</span>
          <span *ngSwitchCase="'advertencia'">⚠</span>
          <span *ngSwitchCase="'info'">ℹ</span>
        </ng-container>
      </span>
      <span class="notificacion-mensaje">{{ notificacion.mensaje }}</span>
    </div>
    <button class="notificacion-cerrar" (click)="cerrarNotificacion()">✕</button>
  </div>
</div>

<!-- Layout con Header y Footer -->
<div class="app-layout">
  <app-encabezado></app-encabezado>
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
  <app-pie-pagina></app-pie-pagina>
</div>
