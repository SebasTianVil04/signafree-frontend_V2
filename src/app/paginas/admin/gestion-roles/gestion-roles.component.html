<div class="gestion-roles container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">
            <i class="bi bi-shield-lock-fill me-2"></i>
            Gestión de Roles y Permisos
        </h1>
        <button class="btn btn-primary" (click)="abrirModalNuevo()">
            <i class="bi bi-plus-circle me-2"></i>
            Nuevo Rol
        </button>
    </div>

    <div *ngIf="!cargando()" class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Código</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                            <th>Permisos</th>
                            <th>Estado</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let rol of roles()">
                            <td><code>{{ rol.codigo }}</code></td>
                            <td>{{ rol.nombre }}</td>
                            <td>{{ rol.descripcion || '-' }}</td>
                            <td>
                                <span class="badge bg-secondary">{{ rol.permisos.length }} permisos</span>
                            </td>
                            <td>
                                <span class="badge" [class.bg-success]="rol.activo" [class.bg-danger]="!rol.activo">
                                    {{ rol.activo ? 'Activo' : 'Inactivo' }}
                                </span>
                            </td>
                            <td class="text-center">
                                <div class="btn-group">
                                    <button class="btn btn-sm btn-outline-info" (click)="abrirModalEditar(rol)"
                                        title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm" [class.btn-outline-danger]="rol.activo"
                                        [class.btn-outline-success]="!rol.activo" (click)="cambiarEstado(rol)"
                                        [disabled]="rol.es_sistema" title="Cambiar estado">
                                        <i class="bi" [class.bi-x-circle]="rol.activo"
                                            [class.bi-check-circle]="!rol.activo"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" (click)="eliminarRol(rol)"
                                        [disabled]="rol.es_sistema" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" [class.show]="mostrarModalRol" [style.display]="mostrarModalRol ? 'block' : 'none'"
        tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">
                        {{ rolEditando ? 'Editar Rol' : 'Nuevo Rol' }}
                    </h5>
                    <button type="button" class="btn-close btn-close-white" (click)="cerrarModal()"
                        [disabled]="guardando()"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Código</label>
                                <input type="text" class="form-control" [(ngModel)]="formRol.codigo" name="codigo"
                                    [disabled]="!!rolEditando || guardando()">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" class="form-control" [(ngModel)]="formRol.nombre" name="nombre"
                                    [disabled]="guardando()">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción</label>
                            <textarea class="form-control" rows="2" [(ngModel)]="formRol.descripcion"
                                name="descripcion" [disabled]="guardando()"></textarea>
                        </div>

                        <div class="mb-2">
                            <label class="form-label fw-bold">Permisos</label>
                        </div>

                        <div class="accordion" *ngFor="let grupo of permisosPorModulo()">
                            <div class="mb-2">
                                <p class="fw-bold text-uppercase small text-muted mb-1">{{ grupo.modulo }}</p>
                                <div class="form-check" *ngFor="let permiso of grupo.permisos">
                                    <input type="checkbox" class="form-check-input" [id]="'permiso-' + permiso.id"
                                        [checked]="tienePermisoSeleccionado(permiso.id)"
                                        (change)="togglePermiso(permiso.id)" [disabled]="guardando()">
                                    <label class="form-check-label" [for]="'permiso-' + permiso.id">
                                        {{ permiso.descripcion }} <code class="text-muted">({{ permiso.codigo }})</code>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" (click)="cerrarModal()"
                        [disabled]="guardando()">Cancelar</button>
                    <button type="button" class="btn btn-primary" (click)="guardar()" [disabled]="guardando()">
                        <span *ngIf="guardando()" class="spinner-border spinner-border-sm me-2" role="status"></span>
                        <i *ngIf="!guardando()" class="bi bi-check-lg me-2"></i>
                        {{ guardando() ? 'Guardando...' : 'Guardar' }}
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-backdrop fade" [class.show]="mostrarModalRol" *ngIf="mostrarModalRol"
        (click)="cerrarModal()"></div>
</div>
