<nav class="navbar" *ngIf="usuario">

  <div class="navbar-top">
    <div class="navbar-top-container">

      <a (click)="navegarA($event, '/inicio')" class="logo">
        <span class="logo-icon">🤟</span>
        <span class="logo-text">SignaFree</span>
      </a>

      <div class="navbar-user">
        <div class="user-menu" (click)="toggleMenuUsuario($event)">
          <div class="user-avatar" [class.admin]="esAdmin" [class.user]="esUser">
            {{ iniciales }}
          </div>
          <div class="user-info">
            <span class="user-name">{{ usuario.nombres }}</span>
            <span class="user-role">{{ nombreRol }}</span>
          </div>
          <span class="dropdown-arrow" [class.active]="menuUsuarioAbierto">▾</span>
        </div>

        <div class="user-dropdown" [class.active]="menuUsuarioAbierto">
          <a (click)="navegarA($event, '/perfil')" class="dropdown-item">
            <span class="dropdown-icon">👤</span>
            <span>Mi Perfil</span>
          </a>
          <div class="dropdown-divider"></div>
          <a (click)="cerrarSesion($event)" class="dropdown-item logout">
            <span class="dropdown-icon">🚪</span>
            <span>Cerrar Sesión</span>
          </a>
        </div>
      </div>

      <button class="navbar-toggle" (click)="toggleMenu()"
        [attr.aria-label]="menuAbierto ? 'Cerrar menú' : 'Abrir menú'">
        <span class="toggle-icon" [class.active]="menuAbierto">
          <span></span><span></span><span></span>
        </span>
      </button>

    </div>
  </div>

  <div class="navbar-menu" [class.active]="menuAbierto">

    <div class="mobile-user-section">
      <div class="user-avatar-large" [class.admin]="esAdmin" [class.user]="esUser">
        {{ iniciales }}
      </div>
      <div class="user-details">
        <div class="user-name-large">{{ usuario.nombres }}</div>
        <div class="user-role-large">{{ nombreRol }}</div>
      </div>
      <button class="close-menu-btn" (click)="cerrarMenus()" aria-label="Cerrar">✕</button>
    </div>

    <ul class="nav-links">
      <li *ngFor="let item of menuItems; trackBy: trackByLabel"
        [class.has-submenu]="item.hijos && item.hijos.length > 0">

        <ng-container *ngIf="item.hijos && item.hijos.length > 0">
          <a (click)="toggleSubmenu($event, item.label)" class="nav-link"
            [class.active]="submenuAbierto === item.label">
            <span class="nav-icon">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
            <span class="dropdown-icon" [class.active]="submenuAbierto === item.label">▾</span>
          </a>

          <ul class="submenu" [class.active]="submenuAbierto === item.label">
            <li *ngFor="let hijo of item.hijos; trackBy: trackByLabel">
              <a (click)="navegarA($event, hijo.ruta)" class="submenu-link" [class.active]="esRutaActiva(hijo.ruta)">
                <span class="submenu-icon">{{ hijo.icon }}</span>
                <span>{{ hijo.label }}</span>
              </a>
            </li>
          </ul>
        </ng-container>

        <ng-container *ngIf="!item.hijos || item.hijos.length === 0">
          <a (click)="navegarA($event, item.ruta)" class="nav-link" [class.active]="esRutaActiva(item.ruta)">
            <span class="nav-icon">{{ item.icon }}</span>
            <span class="nav-label">{{ item.label }}</span>
          </a>
        </ng-container>

      </li>
    </ul>

    <div class="mobile-user-actions">
      <a (click)="navegarA($event, '/perfil')" class="mobile-action">
        <span class="action-icon">👤</span>
        <span>Mi Perfil</span>
      </a>
      <a (click)="cerrarSesion($event)" class="mobile-action logout">
        <span class="action-icon">🚪</span>
        <span>Cerrar Sesión</span>
      </a>
    </div>

  </div>

</nav>

<div class="navbar-overlay" *ngIf="menuAbierto || menuUsuarioAbierto" (click)="cerrarMenus()"></div>
