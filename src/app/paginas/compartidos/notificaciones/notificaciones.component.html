<div class="notificaciones-contenedor" aria-live="polite">
  <div
    *ngFor="let notificacion of notificaciones"
    class="notificacion"
    role="alert"
    [class.exito]="notificacion.tipo === 'exito'"
    [class.error]="notificacion.tipo === 'error'"
    [class.advertencia]="notificacion.tipo === 'advertencia'"
    [class.info]="notificacion.tipo === 'info'">
    <div class="notificacion-contenido">
      <i class="fas" [ngClass]="obtenerIcono(notificacion.tipo)"></i>
      <span class="mensaje">{{ notificacion.mensaje }}</span>
    </div>
    <button type="button" class="btn-cerrar" aria-label="Cerrar notificación" (click)="eliminarNotificacion(notificacion.id!)">
      <i class="fas fa-times"></i>
    </button>
  </div>
</div>
