<div class="visualizador-container">
  <div class="canvas-wrapper">
    <canvas #canvas></canvas>
  </div>

  <div class="controles">
    <button type="button" (click)="dibujar()" class="btn btn-primary">
      <i class="fas fa-sync"></i> Actualizar
    </button>
    <button type="button" (click)="descargarImagen()" class="btn btn-success">
      <i class="fas fa-download"></i> Descargar
    </button>
  </div>

  <div class="leyenda">
    <h4>Leyenda de Puntos</h4>
    <div class="leyenda-items">
      <div class="leyenda-item">
        <span class="color-box muneca"></span>
        <span>Muñeca (0)</span>
      </div>
      <div class="leyenda-item">
        <span class="color-box pulgar"></span>
        <span>Pulgar (1-4)</span>
      </div>
      <div class="leyenda-item">
        <span class="color-box indice"></span>
        <span>Índice (5-8)</span>
      </div>
      <div class="leyenda-item">
        <span class="color-box medio"></span>
        <span>Medio (9-12)</span>
      </div>
      <div class="leyenda-item">
        <span class="color-box anular"></span>
        <span>Anular (13-16)</span>
      </div>
      <div class="leyenda-item">
        <span class="color-box menique"></span>
        <span>Meñique (17-20)</span>
      </div>
    </div>
  </div>

  <div class="info" *ngIf="puntos.length > 0">
    <p><strong>Total de puntos:</strong> {{ puntos.length }}</p>
  </div>

  <div class="vacio" *ngIf="puntos.length === 0">
    <i class="fas fa-hand-paper"></i>
    <p>No hay puntos para visualizar</p>
  </div>
</div>
