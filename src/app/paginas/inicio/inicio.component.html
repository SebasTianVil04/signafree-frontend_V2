<div class="inicio-container">
  <div class="inicio-card">
    <div class="header-section">
      <h1 class="app-title">¡Bienvenido a SignaFree!</h1>
      <button type="button" class="btn-logout" (click)="cerrarSesion()">
        Cerrar Sesión
      </button>
    </div>

    <div class="user-info" *ngIf="usuario">
      <div class="avatar">
        {{ iniciales }}
      </div>
      <div class="user-details">
        <h2 class="user-name">{{ nombreCompleto }}</h2>
        <p class="user-email">{{ usuario.email }}</p>
        <span class="user-badge" [class.admin-badge]="esAdmin">
          {{ nombreRol }}
        </span>
      </div>
    </div>

    <div class="welcome-message">
      <h3>🎉 ¡Tu cuenta ha sido creada exitosamente!</h3>
      <p>Estás listo para comenzar tu viaje de aprendizaje del Lenguaje de Señas Peruano.</p>
    </div>

    <div class="info-section">
      <button
        *ngFor="let tarjeta of tarjetas; trackBy: trackByRuta"
        type="button"
        class="info-card"
        [class.clickable]="esRolUsuario"
        [disabled]="!esRolUsuario"
        [attr.aria-label]="esRolUsuario ? 'Ir a ' + tarjeta.titulo : tarjeta.titulo"
        (click)="irA(tarjeta.ruta)">
        <div class="icon" aria-hidden="true">{{ tarjeta.icono }}</div>
        <h4>{{ tarjeta.titulo }}</h4>
        <p>{{ tarjeta.descripcion }}</p>
        <span class="info-link" *ngIf="esRolUsuario">{{ tarjeta.accion }} →</span>
      </button>
    </div>
  </div>
</div>
